name: Sync from Dev
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download from dev
        run: |
          curl -f -o index.html "https://raw.githubusercontent.com/ALCAMP-Stadiums/ALCAMP-/claude/alcamp-stadium-app-xnct4z/index.html"
          curl -f -o sw.js "https://raw.githubusercontent.com/ALCAMP-Stadiums/ALCAMP-/claude/alcamp-stadium-app-xnct4z/sw.js" 2>/dev/null || true
      - name: Push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/halzwbyta-alt/ALCAMP-.git
          git add index.html sw.js
          git diff --staged --quiet && echo "No changes" || (git commit -m "Auto sync from dev" && git push)
